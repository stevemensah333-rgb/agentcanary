# Local-only integration stack. See docs/LOCAL_DEVELOPMENT.md.
networks:
  canary-net:
    driver: bridge

services:

  # ── Internal: Redis queue for optional durable release workers ────────────
  # Local users can leave RELEASE_EXECUTION_MODE=thread. Hosted deployments
  # use the same contract with ElastiCache instead of this container.
  canary-redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - canary-redis-data:/data
    networks:
      - canary-net
    restart: unless-stopped

  # ── Internal: FastAPI red-team backend (port 8001) ───────────────────────
  redteam-backend:
    build:
      context: ./cyber-redteam-foundry
      dockerfile: Dockerfile
    command: >
      uvicorn cyberredteam.api:app
        --host 0.0.0.0
        --port 8001
        --timeout-keep-alive 300
    env_file:
      - ./cyber-redteam-foundry/.env
    environment:
      - RUNNING_IN_DOCKER=true
      - API_SECRET_KEY=${API_SECRET_KEY:?export API_SECRET_KEY}
      - ALLOW_PRIVATE_TARGETS=true
      - REDIS_URL=redis://canary-redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./runs:/app/runs
      - ./reports:/app/reports
    networks:
      - canary-net
    restart: unless-stopped

  # ── Public: nginx + React SPA (host port 8000 → container port 80) ───────
  canary-frontend:
    build:
      context: ./canary
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CANARY_API_URL: http://redteam-backend:8001
      CANARY_API_TOKEN: "${API_SECRET_KEY:?export API_SECRET_KEY}"
      # Loopback-only local demo. Production image defaults to OAuth.
      NODE_ENV: development
      AUTH_REQUIRED: "false"
    networks:
      - canary-net
    restart: unless-stopped
    depends_on:
      - redteam-backend

  # ── Internal: durable release worker (enabled when mode=rq) ──────────────
  redteam-worker:
    profiles: [worker]
    build:
      context: ./cyber-redteam-foundry
      dockerfile: Dockerfile
    command: canary-worker
    env_file:
      - ./cyber-redteam-foundry/.env
    environment:
      - RUNNING_IN_DOCKER=true
      - ALLOW_PRIVATE_TARGETS=true
      - REDIS_URL=redis://canary-redis:6379/0
    volumes:
      - ./runs:/app/runs
      - ./reports:/app/reports
    networks:
      - canary-net
    restart: unless-stopped
    depends_on:
      - canary-redis

  demo-agent:
    profiles: [model-target]
    build:
      context: ./demo-agent
    env_file:
      - ./demo-agent/.env
    ports:
      - "127.0.0.1:9000:8000"
    networks:
      - canary-net

  demo-fixture:
    build:
      context: ./demo-agent
    command: uvicorn companybot.fixture:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:9001:8000"
    networks:
      - canary-net

volumes:
  canary-redis-data:
